[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-intelligence-backend"
version = "1.0.0"
description = "Backend foundation for the private NIFTY Intelligence Terminal."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
server = [
  "uvicorn[standard]>=0.35,<1",
]
test = [
  "httpx>=0.28,<1",
  "scikit-learn>=1.9,<2",
]
research = [
  "scikit-learn>=1.9,<2",
]
provider-angelone = [
  "logzero>=1.7,<2",
  "pycryptodome>=3.23,<4",
  "pyotp>=2.9,<3",
  "smartapi-python==1.5.5",
  "websocket-client>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
